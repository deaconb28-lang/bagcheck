<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>supercruise · What you put in</title>
<link rel="stylesheet" href="card.css">
</head>
<body>
<!--
  Card 03 — contributions

  A 1080x1920 stage. The art is a background and nothing else; every figure on
  this card is set in type, because a number a model drew is a number nobody
  can correct on an artefact whose whole claim is that it came off a brokerage.

  The five data attributes on the stage are this card's own type direction —
  which voice, where on the stage, from which edge, in which case, and in what
  order the lockup's parts run. card.css answers each of them with a rule per
  axis rather than a rule per card, so twelve posters cost about fifteen rules.
  Every one of the five has a default stated on .card itself, which is what
  lets a card minted before this table existed keep drawing the way it drew.
-->
<div class="card" style="width:1080px;height:1920px" data-card="03" data-key="contributions" data-face="geometric" data-place="head" data-align="left" data-case="none" data-order="title-under">
  <!--
    The PNG is the committed source of truth; the WebP is what a reader
    actually downloads. Twelve photographic gradients at 1080x1920 are 38MB as
    PNG and 1.8MB as WebP with nothing visible between them — and the story
    view loads all twelve on a phone. The PNG stays because it is what the
    renderer composites from and what the set was authored as.
  -->
  <picture>
    <source srcset="/wrapped/2026/art/stratosphere-01/bg-03.webp" type="image/webp">
    <img class="bg" src="/wrapped/2026/art/stratosphere-01/bg-03.png" alt="">
  </picture>
  <div class="scrim"></div>

  <div class="layer">
    <p class="eyebrow">supercruise &middot; <span data-token="YEAR">{{YEAR}}</span></p>
    <p class="heroLabel">Deposits this year</p>
    <p class="hero" data-kind="figure" data-token="CONTRIBUTION_COUNT">{{CONTRIBUTION_COUNT}}</p>
    <h1 class="title">What you put in</h1>

    <div class="support">
        <div class="fact">
          <span class="factLabel">Longest streak</span>
          <span class="factValue" data-kind="figure" data-token="CONTRIBUTION_STREAK_WEEKS">{{CONTRIBUTION_STREAK_WEEKS}}</span>
        </div>
    </div>

    <p class="caption" data-caption="">{{CAPTION}}</p>
  </div>

  <span class="mark">
    <svg class="markGlyph" viewBox="0 0 34 34" fill="none" aria-hidden="true">
      <circle cx="17" cy="17" r="13" pathLength="100" stroke="currentColor" stroke-width="2.4"
              stroke-dasharray="37 13 37 13" stroke-dashoffset="6"/>
      <path d="M28 5.6 L9.6 16.8 L16.7 19.2 L17.3 26.4 Z" fill="currentColor"/>
      <path d="M13.4 22.8 L7.2 29" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M8.4 18.8 L3 24.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
    </svg>supercruise</span>
  <span class="provenance">Read-only via SnapTrade</span>
</div>
</body>
</html>
