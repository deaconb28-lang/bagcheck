<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 40 40">
  <!--
    The favicon, and it is deliberately not the mark.

    A favicon is rendered at 16-32px, which is a quarter of the size the mark
    was drawn for, and three things fail there: the wake's two hairlines go
    sub-pixel and render as grey mud in the lower-left, the ring's stroke thins
    to nothing, and the black tile disappears into a dark tab bar. So this is
    an optical build of the same idea - a dart through a broken ring, and
    nothing else. The full mark, wake included, is what `apple-icon.png` and
    `SupercruiseMark` draw, because at 120px and up the wake reads.

    The ground follows the reader's scheme. On light chrome it is the black
    tile the brand is; on dark chrome it drops out entirely, because a black
    square on a dark tab bar is a hole where an icon should be. The mark stays
    white either way, so it is one drawing with one variable.
  -->
  <style>
    .ground { fill: #000000 }
    @media (prefers-color-scheme: dark) { .ground { fill: none } }
  </style>
  <rect class="ground" width="40" height="40" rx="9"/>
  <g transform="translate(3 3)">
    <circle cx="17" cy="17" r="13" fill="none" pathLength="100" stroke="#ffffff"
      stroke-width="2.8" stroke-dasharray="37 13 37 13" stroke-dashoffset="6"/>
    <path d="M28 5.6 L9.6 16.8 L16.7 19.2 L17.3 26.4 Z" fill="#ffffff"/>
  </g>
</svg>
